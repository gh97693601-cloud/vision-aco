<style>
  :root {
    --bg: #080808; --blue: #2d7dd2; --blue-light: #4a9eff;
    --white: #ffffff; --gray: #aaaaaa; --border: #1e1e1e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--white); font-family: 'Barlow', sans-serif; overflow-x: hidden; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; height: 64px;
    background: rgba(8,8,8,0.95); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 3px; text-decoration: none; color: var(--white); }
  .nav-logo span { color: var(--blue-light); }
  .nav-back { color: var(--gray); text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; transition: color 0.2s; }
  .nav-back:hover { color: var(--white); }
  .nav-whatsapp {
    background: var(--blue); color: var(--white); text-decoration: none;
    font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;
    padding: 8px 20px; transition: background 0.2s;
  }
  .nav-whatsapp:hover { background: var(--blue-light); }
  .page-header {
    padding: 120px 40px 60px; border-bottom: 1px solid var(--border);
  }
  .page-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 6vw, 5rem); letter-spacing: 4px; }
  .page-title span { color: var(--blue-light); }
  .page-count { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; letter-spacing: 3px; color: var(--gray); text-transform: uppercase; margin-top: 8px; }
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px;
    padding: 2px;
  }
  .img-card {
    position: relative; overflow: hidden; aspect-ratio: 1/1; cursor: pointer;
  }
  .img-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; filter: brightness(0.85); }
  .img-card:hover img { transform: scale(1.04); filter: brightness(0.5); }
  .img-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.3s;
  }
  .img-card:hover .img-overlay { opacity: 1; }
  .quero-btn {
    background: #25D366; color: var(--white); text-decoration: none;
    font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase;
    padding: 12px 28px; transition: background 0.2s;
  }
  .quero-btn:hover { background: #1ebe5a; }
  /* LIGHTBOX */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.95); align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lb-img { max-width: 90vw; max-height: 85vh; object-fit: contain; }
  .lb-close {
    position: absolute; top: 20px; right: 28px; font-size: 2rem; color: var(--gray);
    cursor: pointer; font-family: 'Barlow Condensed', sans-serif; line-height: 1;
  }
  .lb-close:hover { color: var(--white); }
  .lb-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 2.5rem; color: var(--gray); cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif; padding: 20px;
    transition: color 0.2s; user-select: none;
  }
  .lb-arrow:hover { color: var(--white); }
  .lb-prev { left: 10px; }
  .lb-next { right: 10px; }
  .lb-wa {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #25D366; color: var(--white); text-decoration: none;
    font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase;
    padding: 12px 32px;
  }
  footer {
    padding: 40px; display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--border); margin-top: 2px;
  }
  .footer-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 3px; }
  .footer-logo span { color: var(--blue-light); }
  .footer-copy { font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; color: #444; letter-spacing: 1px; }
  @media (max-width: 768px) {
    nav { padding: 0 20px; }
    .page-header { padding: 100px 20px 40px; }
    footer { flex-direction: column; gap: 12px; text-align: center; padding: 30px 20px; }
  }
</style>

<script>
const imgs = ["imgs/pt1.jpg", "imgs/pt2.jpg", "imgs/pt3.jpg", "imgs/pt4.jpg", "imgs/pt5.jpg", "imgs/pt6.jpg", "imgs/pt7.jpg", "imgs/pt8.jpg"];
let cur = 0;
function openLightbox(i) {
  cur = i;
  document.getElementById('lb-img').src = imgs[i];
  document.getElementById('lb-wa').href = 'https://wa.me/5534988780922?text=Olá!%20Tenho%20interesse%20em%20um%20Portas%20(modelo%20'+(i+1)+')';
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
function changeImg(d) {
  cur = (cur + d + imgs.length) % imgs.length;
  openLightbox(cur);
}
document.getElementById('lightbox').addEventListener('click', function(e) {
  if(e.target === this) closeLightbox();
});
document.addEventListener('keydown', function(e) {
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') changeImg(-1);
  if(e.key==='ArrowRight') changeImg(1);
});
</script>
