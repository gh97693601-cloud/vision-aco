<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho — Vision Aço</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#080808;--dark:#0f0f0f;--dark2:#141414;--dark3:#1a1a1a;
  --accent:#2d7dd2;--accent2:#4a9eff;--green:#10b981;--red:#ef4444;
  --white:#f0f0f0;--grey:#777;--border:rgba(255,255,255,.07);--radius:3px;
}
html{scroll-behavior:smooth}
body{font-family:'Barlow',sans-serif;background:var(--black);color:var(--white);min-height:100vh;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(8,8,8,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-logo-mark{width:32px;height:32px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fff;border-radius:2px}
.nav-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px}
.nav-name span{color:var(--accent2)}
.nav-wa{display:flex;align-items:center;gap:6px;background:#25D366;color:#fff;padding:7px 14px;border-radius:var(--radius);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}

/* CART PAGE */
.cart-page{max-width:1100px;margin:0 auto;padding:96px 32px 80px;display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:start}

/* CART HEADER */
.cart-header{margin-bottom:28px}
.cart-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--accent2);margin-bottom:10px}
.cart-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,5vw,52px);letter-spacing:3px}
.cart-count{font-size:13px;color:var(--grey);margin-top:6px}

/* ITEMS */
.cart-items{border-top:1px solid var(--border)}
.cart-item{
  display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;
  padding:20px 0;border-bottom:1px solid var(--border);
}
.item-img{
  width:90px;height:90px;background:var(--dark3);border-radius:var(--radius);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.item-img img{width:100%;height:100%;object-fit:cover}
.item-img-ph{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
}
.item-info{}
.item-cat{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--accent2);margin-bottom:4px}
.item-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;letter-spacing:.3px;margin-bottom:6px}
.item-vars{font-size:11px;color:var(--grey)}
.item-price{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--white);margin-top:6px;letter-spacing:1px}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.item-qty{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.iq-btn{width:30px;height:30px;background:var(--dark3);border:none;color:var(--white);cursor:pointer;font-size:14px;transition:background .2s;display:flex;align-items:center;justify-content:center}
.iq-btn:hover{background:var(--dark2)}
.iq-val{width:36px;height:30px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--dark2)}
.item-remove{background:none;border:none;color:var(--grey);cursor:pointer;font-size:11px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;transition:color .2s;padding:0}
.item-remove:hover{color:var(--red)}

/* EMPTY STATE */
.empty-cart{
  grid-column:1/-1;text-align:center;padding:80px 24px;
  border:1px dashed rgba(255,255,255,.08);border-radius:4px;
}
.empty-cart h2{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:3px;color:var(--grey);margin-bottom:12px}
.empty-cart p{font-size:14px;color:var(--grey);margin-bottom:24px}
.btn-back{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--accent);color:#fff;
  padding:12px 28px;border-radius:var(--radius);
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;transition:background .2s;
}
.btn-back:hover{background:var(--accent2)}

/* ORDER SUMMARY */
.order-summary{
  background:var(--dark2);border:1px solid var(--border);
  border-radius:var(--radius);padding:28px;position:sticky;top:80px;
}
.summary-title{
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;
  margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);
}
.summary-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.summary-label{font-size:13px;color:var(--grey)}
.summary-value{font-size:14px;font-weight:600}
.summary-divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.summary-total-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.summary-total-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--grey)}
.summary-total-value{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent2);letter-spacing:2px}
.summary-pix{
  display:flex;align-items:center;gap:8px;
  background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15);
  border-radius:2px;padding:10px 12px;margin-bottom:20px;
}
.pix-info strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--green)}
.pix-info span{font-size:11px;color:var(--grey)}
.pix-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--green);margin-left:auto;letter-spacing:1px}

/* CUPOM */
.coupon-row{display:flex;gap:6px;margin-bottom:20px}
.coupon-input{
  flex:1;background:var(--dark3);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 12px;
  color:var(--white);font-family:'Barlow Condensed',sans-serif;font-size:12px;
  letter-spacing:1px;text-transform:uppercase;outline:none;
  transition:border-color .2s;
}
.coupon-input:focus{border-color:var(--accent)}
.coupon-input::placeholder{color:var(--grey);text-transform:none;letter-spacing:0}
.coupon-btn{
  background:var(--dark3);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 14px;color:var(--grey);
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;
  white-space:nowrap;
}
.coupon-btn:hover{border-color:var(--accent2);color:var(--accent2)}

/* CHECKOUT BTN */
.btn-checkout{
  width:100%;padding:16px;border-radius:var(--radius);
  background:var(--accent);color:#fff;border:none;cursor:pointer;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;
  transition:all .25s;display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:10px;
}
.btn-checkout:hover{background:var(--accent2);transform:translateY(-2px)}
.btn-checkout-wa{
  width:100%;padding:12px;border-radius:var(--radius);
  background:#25D366;color:#fff;border:none;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:16px;
}
.btn-checkout-wa:hover{background:#1fb958}
.security-note{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--grey);justify-content:center;
}

/* TRUST MINI */
.trust-mini{
  display:flex;gap:10px;margin-top:16px;padding-top:16px;
  border-top:1px solid var(--border);flex-wrap:wrap;justify-content:center;
}
.trust-mini-item{
  display:flex;align-items:center;gap:5px;
  font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--grey);
}

/* FLOAT WA */
.fwa{position:fixed;bottom:24px;right:24px;z-index:900;width:54px;height:54px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 22px rgba(37,211,102,.4);transition:transform .2s;text-decoration:none}
.fwa:hover{transform:scale(1.1)}

footer{background:var(--dark);border-top:1px solid var(--border);padding:24px 32px;text-align:center}
footer p{font-size:11px;color:rgba(100,100,100,.6)}

/* MOBILE */
@media(max-width:768px){
  nav{padding:0 14px}
  .cart-page{grid-template-columns:1fr;padding:82px 16px 60px;gap:28px}
  .order-summary{position:static}
  .cart-item{grid-template-columns:72px 1fr auto;gap:12px}
  .item-img{width:72px;height:72px}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">

    <span class="nav-name">VISION <span>AÇO</span></span>

<div class="cart-page">

    <button class="btn-checkout-wa" id="wa-checkout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>

    </button>

    </div>

      </div>

</div>

<footer>
  <p>© 2025 Vision Aço — Serralheria Premium | Uberlândia - MG</p>
</footer>

<a href="https://wa.me/5534988780922" target="_blank" class="fwa" aria-label="WhatsApp">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>

<script>
// ── CARRINHO ──
// Demo items — substitua pela lógica real de localStorage ou backend
var cartItems = [
  // Exemplo de estrutura:
  // {id:'ba01', name:'Base Modelo 01', cat:'Bases de Mesa', price:890, qty:1, cover:'', vars:'Médio · Preto Fosco · Com tampo'}
];

var itemsEl = document.getElementById('cart-items');
var countEl = document.getElementById('cart-count');

function renderCart() {
  if (cartItems.length === 0) {
    itemsEl.innerHTML =
      '<div class="empty-cart">' +
        '<h2>Carrinho vazio</h2>' +
        '<p>Você ainda não adicionou nenhum produto ao carrinho.</p>' +
        '<a href="index.html" class="btn-back">← Ver produtos</a>' +
      '</div>';
    countEl.textContent = '0 itens';
    document.getElementById('subtotal').textContent = 'R$ 0,00';
    document.getElementById('total').textContent = 'R$ 0';
    document.getElementById('pix-total').textContent = 'R$ 0';
    return;
  }

  var total = 0;
  itemsEl.innerHTML = '';
  cartItems.forEach(function(item, idx) {
    total += item.price * item.qty;
    var row = document.createElement('div');
    row.className = 'cart-item';
    row.innerHTML =
      '<div class="item-img">' +
        (item.cover
          ? '<img src="' + item.cover + '" alt="' + item.name + '">'
          : '<div class="item-img-ph"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></div>') +
      '</div>' +
      '<div class="item-info">' +
        '<div class="item-cat">' + item.cat + '</div>' +
        '<div class="item-name">' + item.name + '</div>' +
        '<div class="item-vars">' + (item.vars || '') + '</div>' +
        '<div class="item-price">R$ ' + (item.price * item.qty).toLocaleString('pt-BR') + '</div>' +
      '</div>' +
      '<div class="item-right">' +
        '<div class="item-qty">' +
          '<button class="iq-btn" onclick="changeItemQty(' + idx + ',-1)">−</button>' +
          '<div class="iq-val">' + item.qty + '</div>' +
          '<button class="iq-btn" onclick="changeItemQty(' + idx + ',1)">+</button>' +
        '</div>' +
        '<button class="item-remove" onclick="removeItem(' + idx + ')">✕ Remover</button>' +
      '</div>';
    itemsEl.appendChild(row);
  });

  var totalItems = cartItems.reduce(function(s,i){return s+i.qty},0);
  countEl.textContent = totalItems + (totalItems === 1 ? ' item' : ' itens');
  document.getElementById('subtotal').textContent = 'R$ ' + total.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('total').textContent = 'R$ ' + total.toLocaleString('pt-BR');
  var pix = Math.round(total * 0.9);
  document.getElementById('pix-total').textContent = 'R$ ' + pix.toLocaleString('pt-BR');

  // WA checkout msg
  var msg = 'Olá! Quero finalizar meu pedido:\n\n';
  cartItems.forEach(function(i){
    msg += '• ' + i.name + ' (x' + i.qty + ') — R$ ' + (i.price*i.qty).toLocaleString('pt-BR') + '\n';
  });
  msg += '\nTotal: R$ ' + total.toLocaleString('pt-BR');
  document.getElementById('wa-checkout').onclick = function() {
    window.open('https://wa.me/5534988780922?text=' + encodeURIComponent(msg), '_blank');
  };
}

function changeItemQty(idx, dir) {
  cartItems[idx].qty = Math.max(1, cartItems[idx].qty + dir);
  renderCart();
}

function removeItem(idx) {
  cartItems.splice(idx, 1);
  renderCart();
}

function applyCoupon() {
  var code = document.getElementById('coupon-input').value.trim().toUpperCase();
  alert(code ? 'Cupom "' + code + '" — funcionalidade a integrar.' : 'Digite um cupom válido.');
}

function checkout() {
  alert('Funcionalidade de checkout será integrada ao sistema de pagamento (ex: Shopify, Mercado Pago).');
}

renderCart();
</script>
</body>
</html>
