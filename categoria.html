<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categoria — Vision Aço</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#080808;--dark:#0f0f0f;--dark2:#141414;--dark3:#1a1a1a;--dark4:#222;
  --accent:#2d7dd2;--accent2:#4a9eff;
  --white:#f0f0f0;--grey:#777;--border:rgba(255,255,255,.07);--radius:3px;
}
html{scroll-behavior:smooth}
body{font-family:'Barlow',sans-serif;background:var(--black);color:var(--white);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(8,8,8,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-logo-mark{width:32px;height:32px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fff;border-radius:2px}
.nav-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px}
.nav-name span{color:var(--accent2)}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-cart{position:relative;width:38px;height:38px;border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--grey);transition:all .2s}
.nav-cart:hover{border-color:var(--accent2);color:var(--white)}
.cart-badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;background:var(--accent);border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif}
.nav-wa{display:flex;align-items:center;gap:6px;background:#25D366;color:#fff;padding:7px 14px;border-radius:var(--radius);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;transition:background .2s}
.nav-wa:hover{background:#1fb958}

/* CAT HEADER */
.cat-hero{
  padding:96px 32px 48px;
  background:linear-gradient(180deg, var(--dark2) 0%, var(--black) 100%);
  border-bottom:1px solid var(--border);
}
.cat-hero-inner{max-width:1200px;margin:0 auto}
.breadcrumb{
  display:flex;align-items:center;gap:8px;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;color:var(--grey);margin-bottom:20px;
}
.breadcrumb a{color:var(--accent2);transition:opacity .2s}
.breadcrumb a:hover{opacity:.7}
.breadcrumb span{opacity:.3}
.cat-meta-row{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px}
.cat-overline{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--accent2);margin-bottom:8px}
.cat-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,6vw,68px);letter-spacing:3px;line-height:.95}
.cat-count{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--grey);margin-top:8px;letter-spacing:.5px}
.cat-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-btn{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;color:var(--grey);
  border:1px solid var(--border);padding:7px 14px;border-radius:var(--radius);
  background:transparent;cursor:pointer;transition:all .2s;
}
.filter-btn:hover,.filter-btn.active{color:var(--accent2);border-color:var(--accent2)}

/* PRODUCT GRID */
.catalog-body{max-width:1200px;margin:0 auto;padding:40px 32px 80px}
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
.prod-card{background:var(--dark2);cursor:pointer;display:flex;flex-direction:column;transition:transform .2s}
.prod-card:hover{transform:translateY(-4px)}
.prod-img-wrap{aspect-ratio:1/1;background:var(--dark3);position:relative;overflow:hidden}
.prod-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.prod-card:hover .prod-img-wrap img{transform:scale(1.06)}
.prod-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.ph-box{width:64px;height:64px;border:2px solid rgba(255,255,255,.08);border-radius:4px;display:flex;align-items:center;justify-content:center}
.ph-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.12);text-transform:uppercase}
.prod-badge{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 9px;border-radius:2px}
.prod-badge.novo{background:#10b981}
.prod-badge.oferta{background:#f59e0b}
.prod-info{padding:14px 16px 18px;display:flex;flex-direction:column;flex:1}
.prod-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;letter-spacing:.3px;margin-bottom:6px;color:var(--white)}
.prod-stars{color:#f59e0b;font-size:11px;margin-bottom:8px;letter-spacing:1px}
.prod-installment{font-size:11px;color:var(--grey);margin-bottom:3px}
.prod-price{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent2);letter-spacing:1px}
.prod-pix{font-size:11px;color:#10b981;margin-top:2px;margin-bottom:12px}
.prod-vars{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.var-chip{
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);
  border:1px solid var(--border);padding:3px 8px;border-radius:2px;
}
.prod-actions{display:flex;gap:6px;margin-top:auto}
.btn-buy{
  flex:1;background:var(--accent);color:#fff;border:none;
  padding:11px;border-radius:var(--radius);
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .2s;
}
.btn-buy:hover{background:var(--accent2)}
.btn-wa-sm{
  width:40px;background:#25D366;color:#fff;border:none;
  border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .2s;flex-shrink:0;
}
.btn-wa-sm:hover{background:#1fb958}

/* EMPTY STATE */
.empty-state{
  grid-column:1/-1;text-align:center;padding:80px 24px;
  border:1px dashed rgba(255,255,255,.08);border-radius:4px;
}
.empty-state h3{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--grey);margin-bottom:8px}
.empty-state p{font-size:13px;color:var(--grey2)}

/* PAGINATION */
.pagination{display:flex;justify-content:center;gap:6px;padding:40px 0 0}
.page-btn{
  width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;
  color:var(--grey);cursor:pointer;transition:all .2s;background:transparent;
}
.page-btn.active,.page-btn:hover{border-color:var(--accent);color:var(--accent2)}

/* FLOAT WA */
.fwa{position:fixed;bottom:24px;right:24px;z-index:900;width:54px;height:54px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 22px rgba(37,211,102,.4);transition:transform .2s;text-decoration:none}
.fwa:hover{transform:scale(1.1)}

/* FOOTER */
footer{background:var(--dark);border-top:1px solid var(--border);padding:32px;text-align:center}
footer p{font-size:11px;color:rgba(100,100,100,.6)}

/* MOBILE */
@media(max-width:640px){
  nav{padding:0 14px}
  .cat-hero{padding:82px 16px 36px}
  .catalog-body{padding:28px 16px 60px}
  .prod-grid{grid-template-columns:1fr 1fr;gap:2px}
  .cat-filters{gap:6px}
  .filter-btn{font-size:10px;padding:6px 10px}
}
@media(min-width:641px) and (max-width:900px){
  .prod-grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:901px){
  .prod-grid{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1100px){
  .prod-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-brand">
    <div class="nav-logo-mark">V</div>
    <span class="nav-name">VISION <span>AÇO</span></span>
  </a>
  <div class="nav-right">
    <a href="carrinho.html" class="nav-cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>

<div class="cat-hero">

      <span id="cat-breadcrumb">Categoria</span>

        <p class="cat-count" id="cat-count">0 modelos disponíveis</p>
      </div>

        <button class="filter-btn active">Todos</button>

        <button class="filter-btn">Maior preço</button>
        <button class="filter-btn">Novidades</button>
      </div>
    </div>
  </div>
</div>

<!-- GRID -->
<div class="catalog-body">
  <div class="prod-grid" id="prod-grid"></div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- FOOTER -->
<footer>
  <p>© 2025 Vision Aço — Serralheria Premium | Uberlândia - MG</p>
</footer>

<!-- FLOAT WA -->
<a href="https://wa.me/5534988780922" target="_blank" class="fwa" aria-label="WhatsApp">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>

<script>
// ── CONFIG DA CATEGORIA ──
// Edite este objeto para configurar a página
var CATEGORIA = {
  id: 'bases',           // identificador
  num: '01',             // número
  name: 'Bases de Mesa', // nome exibido
  produtos: []           // array de produtos (preencher depois)
  // Estrutura de cada produto:
  // {
  //   id: 'ba01',
  //   name: 'Base Modelo 01',
  //   price: 'R$ 890',
  //   installment: '12x R$ 74,16',
  //   pix: 'R$ 801 no Pix',
  //   badge: 'Novo',       // opcional: 'Novo', 'Oferta', 'Destaque'
  //   stars: '★★★★★',
  //   sizes: ['P', 'M', 'G'], // variações de tamanho
  //   cover: 'imgs/ba01.jpg',
  //   link: 'produto.html?id=ba01'
  // }
};

// Atualizar cabeçalho
document.getElementById('cat-breadcrumb').textContent = CATEGORIA.name;
document.getElementById('cat-overline').textContent = 'Categoria ' + CATEGORIA.num;
document.getElementById('cat-title').textContent = CATEGORIA.name;
document.getElementById('cat-count').textContent = CATEGORIA.produtos.length + ' modelos disponíveis';

// Filtros
document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
  });
});

// Grid de produtos
var grid = document.getElementById('prod-grid');

if (CATEGORIA.produtos.length === 0) {
  grid.innerHTML =
    '<div class="empty-state">' +
      '<h3>Produtos em breve</h3>' +
      '<p>Os produtos desta categoria serão adicionados em breve.</p>' +
    '</div>';
} else {
  CATEGORIA.produtos.forEach(function(p) {
    var badgeClass = p.badge === 'Novo' ? 'novo' : p.badge === 'Oferta' ? 'oferta' : '';
    var sizesHtml = p.sizes ? p.sizes.map(function(s) { return '<span class="var-chip">' + s + '</span>'; }).join('') : '';
    var card = document.createElement('div');
    card.className = 'prod-card';
    card.innerHTML =
      '<div class="prod-img-wrap">' +
        (p.cover
          ? '<img src="' + p.cover + '" alt="' + p.name + '" loading="lazy">'
          : '<div class="prod-placeholder"><div class="ph-box"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></div><span class="ph-label">' + p.id + '</span></div>') +
        (p.badge ? '<span class="prod-badge ' + badgeClass + '">' + p.badge + '</span>' : '') +
      '</div>' +
      '<div class="prod-info">' +
        '<div class="prod-name">' + p.name + '</div>' +
        '<div class="prod-stars">' + (p.stars || '★★★★★') + '</div>' +
        '<div class="prod-installment">' + (p.installment || '12x —') + '</div>' +
        '<div class="prod-price">' + (p.price || 'R$ ———') + '</div>' +
        '<div class="prod-pix">' + (p.pix || '🔵 Pix com desconto') + '</div>' +
        (sizesHtml ? '<div class="prod-vars">' + sizesHtml + '</div>' : '') +
        '<div class="prod-actions">' +
          '<button class="btn-buy" onclick="window.location.href=\'' + (p.link || 'produto.html') + '\'">Comprar agora</button>' +
          '<button class="btn-wa-sm" onclick="window.open(\'https://wa.me/5534988780922?text=Olá! Tenho interesse no produto: ' + encodeURIComponent(p.name) + '\',\'_blank\')">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>';
    card.addEventListener('click', function(e) {
      if (e.target.tagName !== 'BUTTON') window.location.href = p.link || 'produto.html';
    });
    grid.appendChild(card);
  });
}
</script>
</body>
</html>
